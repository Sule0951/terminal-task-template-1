name: Verify terminal-task submission

# Copy this workflow to an Askable-controlled private verification repository.
# Do not enable it in a participant-owned repository: it uses Askable secrets.
on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Private repository containing the participant submission
        required: true
        type: string
      candidate_commit:
        description: Immutable submission commit SHA to verify
        required: true
        type: string
      task_code_commit:
        description: Commit SHA named in the contributor attestation and calibration record
        required: true
        type: string
      task_path:
        description: Task path relative to the candidate repository
        required: true
        type: string

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          repository: askableorg/terminal-task-template
          ref: main

      - name: Check out candidate at immutable commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_commit }}
          path: candidate
          token: ${{ secrets.CANDIDATE_REPOSITORY_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Harbor
        run: uv tool install harbor

      - name: Add Harbor to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Create protected model environment file
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/askable.env"

      - name: Verify task and calibrate Opus 4.8
        run: |
          ./scripts/verify-submission.sh \
            --candidate-dir "$GITHUB_WORKSPACE/candidate" \
            --task "${{ inputs.task_path }}" \
            --submission-commit "${{ inputs.candidate_commit }}" \
            --task-code-commit "${{ inputs.task_code_commit }}" \
            --env-file "$RUNNER_TEMP/askable.env" \
            --attestation-output "$RUNNER_TEMP/submission-attestation.json"

      - name: Upload verification attestation
        uses: actions/upload-artifact@v4
        with:
          name: submission-attestation
          path: ${{ runner.temp }}/submission-attestation.json

      - name: Sign verification attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/submission-attestation.json
